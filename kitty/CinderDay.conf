# CinderDay for kitty, part of cosmic-cinderday-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./kitty/install.sh puts this in ~/.config/kitty/themes/, then in
# ~/.config/kitty/kitty.conf:
#   include themes/CinderDay.conf

foreground              #1B1A1A
background              #E8E3E3
selection_foreground    none
selection_background    #D3CBCB

cursor                  #A33D00
cursor_text_color       #E8E3E3

url_color               #62604C
url_style               curly

active_border_color     #A33D00
inactive_border_color   #D3CBCB
bell_border_color       #8F4D23

active_tab_foreground   #E8E3E3
active_tab_background   #A33D00
inactive_tab_foreground #5F5959
inactive_tab_background #F3EFEF
tab_bar_background      #E8E3E3

mark1_foreground        #E8E3E3
mark1_background        #605D52
mark2_foreground        #E8E3E3
mark2_background        #62604C
mark3_foreground        #E8E3E3
mark3_background        #8F4D23

