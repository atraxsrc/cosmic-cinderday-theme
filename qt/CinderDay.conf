# CinderDay colour scheme for qt5ct / qt6ct, part of cosmic-cinderday-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> CinderDay, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#1b1a1a, #f3efef, #f3efef, #d3cbcb, #ded8d8, #ded8d8, #1b1a1a, #0e0d0d, #1b1a1a, #f3efef, #e8e3e3, #ded8d8, #a33d00, #e8e3e3, #a33d00, #8f4d23, #f3efef, #e8e3e3, #f3efef, #1b1a1a, #626060
disabled_colors=#959292, #f3efef, #f3efef, #d3cbcb, #ded8d8, #ded8d8, #959292, #5f5959, #959292, #e8e3e3, #e8e3e3, #ded8d8, #d3cbcb, #5f5959, #626060, #626060, #f3efef, #e8e3e3, #f3efef, #1b1a1a, #d3cbcb
inactive_colors=#1b1a1a, #f3efef, #f3efef, #d3cbcb, #ded8d8, #ded8d8, #1b1a1a, #0e0d0d, #1b1a1a, #f3efef, #e8e3e3, #ded8d8, #a33d00, #e8e3e3, #a33d00, #8f4d23, #f3efef, #e8e3e3, #f3efef, #1b1a1a, #626060
