# CinderDay for lazygit, part of cosmic-cinderday-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/cinderday.yml and
# zsh/cinderday.zsh sets LG_CONFIG_FILE to "config.yml,cinderday.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/cinderday.yml"
gui:
  theme:
    activeBorderColor:
      - "#A33D00"
      - bold
    inactiveBorderColor:
      - "#D3CBCB"
    searchingActiveBorderColor:
      - "#8F4D23"
      - bold
    optionsTextColor:
      - "#5F5959"
    selectedLineBgColor:
      - "#DED8D8"
    inactiveViewSelectedLineBgColor:
      - "#F3EFEF"
    cherryPickedCommitFgColor:
      - "#E8E3E3"
    cherryPickedCommitBgColor:
      - "#62604C"
    markedBaseCommitFgColor:
      - "#E8E3E3"
    markedBaseCommitBgColor:
      - "#605D52"
    unstagedChangesColor:
      - "#9E352E"
    defaultFgColor:
      - "#1B1A1A"
  authorColors:
    "*": "#62604C"
